<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Igrač</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <a class="back" href="index.html">&larr; Natrag na popis</a>
    <p id="status">Učitavanje...</p>
    <section id="profile" class="profile" hidden></section>
  </main>

  <script src="config.js"></script>
  <script>
    const pct = v => (v === null || v === undefined) ? "–" : (v * 100).toFixed(1) + "%";
    const num = v => (v === null || v === undefined) ? "–" : v;

    async function load() {
      const status = document.getElementById("status");
      const box = document.getElementById("profile");
      const id = new URLSearchParams(location.search).get("id");
      try {
        const res = await fetch(`${API_URL}/players/${encodeURIComponent(id)}`);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const p = await res.json();
        document.title = p.name;
        status.hidden = true;
        box.hidden = false;
        box.innerHTML = `
          <img class="photo-big" src="${esc(p.photo)}" alt="${esc(p.name)}">
          <h2>${esc(p.name)}</h2>
          <div class="team">
            <img src="${esc(p.team_logo)}" alt="${esc(p.team)}">
            <span>${esc(p.team)}</span>
          </div>
          <div class="stats">
            <div class="stat"><b>${num(p.pts)}</b><span>Poeni</span></div>
            <div class="stat"><b>${num(p.reb)}</b><span>Skokovi</span></div>
            <div class="stat"><b>${num(p.ast)}</b><span>Asistencije</span></div>
            <div class="stat"><b>${num(p.stl)}</b><span>Ukradene</span></div>
            <div class="stat"><b>${num(p.blk)}</b><span>Blokade</span></div>
            <div class="stat"><b>${num(p.tov)}</b><span>Izgubljene</span></div>
            <div class="stat"><b>${pct(p.fg_pct)}</b><span>Šut iz igre</span></div>
            <div class="stat"><b>${pct(p.fg3_pct)}</b><span>Trica</span></div>
            <div class="stat"><b>${pct(p.ft_pct)}</b><span>Slobodna bacanja</span></div>
            <div class="stat"><b>${num(p.gp)}</b><span>Utakmice</span></div>
            <div class="stat"><b>${num(p.min)}</b><span>Minute</span></div>
          </div>`;
      } catch (err) {
        status.textContent = "Igrač nije pronađen ili servis nije dostupan.";
      }
    }
    load();
  </script>
</body>
</html>
